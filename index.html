<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LBS Allotment Predictor 2025</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --navy: #16243a;
    --green: #087443;
    --blue: #1d4e89;
    --yellow: #ffd000;
    --bg: #f4f6f8;
    --white: #ffffff;
    --line: #dce2e8;
    --text: #1a2330;
    --muted: #687789;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    background: var(--navy);
    color: white;
    padding: 20px 16px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 5px 0 0;
    color: #a9b9cc;
    font-size: 13px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 18px 16px 60px;
}

.notice {
    background: #fff8e6;
    border: 1px solid #efd98a;
    border-left: 5px solid #e0a800;
    border-radius: 9px;
    padding: 13px 15px;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 18px;
}

.panel {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 7px;
}

select,
input {
    width: 100%;
    padding: 12px;
    border: 2px solid #c7d0db;
    border-radius: 8px;
    background: white;
    color: var(--text);
    font-size: 15px;
}

input {
    font-size: 20px;
}

select:focus,
input:focus {
    outline: none;
    border-color: var(--blue);
}

button {
    border: 0;
    border-radius: 8px;
    padding: 13px 18px;
    background: var(--yellow);
    color: #111;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.predict-btn {
    width: 100%;
    margin-top: 16px;
    font-size: 16px;
}

.summary {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 12px 15px;
    min-width: 130px;
}

.stat small {
    display: block;
    color: var(--muted);
    font-size: 12px;
}

.stat strong {
    display: block;
    margin-top: 3px;
    font-size: 19px;
}

.section-title {
    margin: 24px 0 8px;
    font-size: 18px;
    padding-left: 10px;
    border-left: 5px solid;
}

.govt-title {
    color: var(--green);
    border-color: var(--green);
}

.self-title {
    color: var(--blue);
    border-color: var(--blue);
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
    background: white;
    border: 1px solid var(--line);
    border-radius: 9px;
}

table {
    width: 100%;
    min-width: 720px;
    border-collapse: collapse;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    font-size: 13px;
}

th {
    background: #eef2f6;
    color: #46586d;
    font-size: 12px;
    text-transform: uppercase;
}

.num {
    text-align: right;
}

.code {
    color: var(--blue);
    font-weight: 700;
}

.margin {
    color: var(--green);
    font-weight: 700;
}

.college-row {
    cursor: pointer;
}

.college-row:hover {
    background: #f0f6ff;
}

.empty {
    background: white;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 16px;
    color: var(--muted);
}

.detail-header {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
    align-items: center;
}

.back {
    background: #e8eef5;
    color: var(--blue);
    margin-bottom: 15px;
}

.stats {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 18px 0;
}

.loading {
    text-align: center;
    padding: 30px;
    color: var(--muted);
}

footer {
    text-align: center;
    color: #7b8794;
    font-size: 12px;
    padding: 25px;
}

@media (max-width: 700px) {

    .grid {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 20px;
    }

    .container {
        padding: 12px;
    }

    .panel {
        padding: 14px;
    }

    .stat {
        flex: 1;
        min-width: 110px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1>LBS Allotment Predictor</h1>
        <p>Kerala Nursing & Paramedical 2025 — Historical Allotment Data</p>
    </div>
</header>

<div class="container">

    <div id="app">
        <div class="loading">
            Loading 2025 LBS data...
        </div>
    </div>

</div>

<footer>
    Historical-data based prediction only. Actual allotment depends on the current year's rank, options, reservation and seat availability.
</footer>


<!--
    Load the public 2025 LBS dataset.
    This avoids uploading the large data file manually from phone.
-->

    SC: "Scheduled Caste",
    ST: "Scheduled Tribe",
    MU: "Muslim",
    LC: "Latin Catholic / SIUC",
    DV: "Dheevara",
    VK: "Viswakarma",
    KU: "Kudumbi",
    EW: "Forward EWS",
    NR: "NRI",
    MQ: "Management",
    BH: "Other Category",
    BX: "Other Category",
    KN: "Other Category",
    PD: "PwD",
    CC: "Special",
    SP: "Special",
    SD: "Special",
    XS: "Special",
    RP: "Special"
};


/* --------------------------------
   HELPERS
-------------------------------- */

function cleanCollegeName(name) {

    return name.replace(
        /^[A-Z]+\s*-\s*/,
        ""
    );
}


function number(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    return Number(value).toFixed(2);
}


function getCourse() {

    const value =
        document.getElementById("course").value;

    return DATA.courses.find(
        c => String(c.value) === String(value)
    );
}


function getCutoff(college, quota) {

    if (quota === "ALL") {

        return college.cutoff;

    }

    if (
        college.cutoffs &&
        college.cutoffs[quota] !== undefined
    ) {

        return college.cutoffs[quota];

    }

    return null;
}


/* --------------------------------
   INITIALISE
-------------------------------- */

    if (!window.LBS_DATA) {

                Unable to load the 2025 LBS data.
                Please refresh the page.
            </div>
        `
