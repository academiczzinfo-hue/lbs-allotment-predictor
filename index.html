<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LBS Allotment Predictor</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f1115;
    color:#fff;
}

.header{
    text-align:center;
    padding:30px 15px 20px;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    color:#9da4ae;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.card{
    background:#181b21;
    border:1px solid #292d35;
    border-radius:14px;
    padding:22px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#cbd0d8;
    font-size:14px;
}

input,select{
    width:100%;
    padding:14px;
    border-radius:9px;
    border:1px solid #343943;
    background:#101216;
    color:#fff;
    font-size:16px;
}

button{
    border:0;
    border-radius:9px;
    padding:14px 18px;
    background:#ffd600;
    color:#111;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.main-button{
    width:100%;
    margin-top:18px;
}

.secondary{
    background:#292f38;
    color:#fff;
    margin-bottom:15px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:20px;
}

.stat{
    background:#181b21;
    border:1px solid #292d35;
    border-radius:9px;
    padding:13px;
}

.stat small{
    display:block;
    color:#8e98a5;
    font-size:12px;
    margin-bottom:5px;
}

.stat strong{
    font-size:18px;
}

.section-title{
    margin:25px 0 10px;
    font-size:20px;
}

.govt{
    color:#42e88b;
}

.self{
    color:#5da9ff;
}

.table-wrap{
    overflow-x:auto;
    background:#181b21;
    border:1px solid #292d35;
    border-radius:9px;
}

table{
    width:100%;
    min-width:760px;
    border-collapse:collapse;
}

th,td{
    padding:11px;
    border-bottom:1px solid #292d35;
    text-align:left;
    font-size:13px;
}

th{
    background:#20242b;
    color:#bfc6d0;
}

.number{
    text-align:right;
}

.code{
    color:#ffd600;
    font-weight:bold;
}

.margin{
    color:#42e88b;
    font-weight:bold;
}

.clickable{
    cursor:pointer;
}

.clickable:hover{
    background:#20252d;
}

.empty{
    background:#181b21;
    border:1px solid #292d35;
    border-radius:10px;
    padding:20px;
    color:#999;
    text-align:center;
}

.loading{
    padding:30px;
    text-align:center;
    color:#999;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.tab{
    flex:1;
    background:#292f38;
    color:#ddd;
}

.tab.active{
    background:#ffd600;
    color:#111;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:15px 0;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .summary{
        grid-template-columns:1fr 1fr;
    }

    .detail-grid{
        grid-template-columns:1fr 1fr;
    }

    .header h1{
        font-size:23px;
    }
}

@media(max-width:450px){

    .summary{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>LBS ALLOTMENT PREDICTOR</h1>
    <p>2025 Historical Allotment Data</p>
</div>

<div class="container">

    <div id="app">
        <div class="loading">
            Loading 2025 LBS data...
        </div>
    </div>

</div>


<script src="data.js"></script>

<script>

let DATA=null;

const QUOTA_NAMES={
    SM:"State Merit",
    EZ:"Ezhava",
    SC:"Scheduled Caste",
    MU:"Muslim",
    MQ:"Management",
    BH:"Other Category",
    LC:"Latin Catholic",
    VK:"Viswakarma",
    DV:"Dheevara",
    EW:"EWS",
    NR:"NRI",
    ST:"Scheduled Tribe",
    KN:"Other Category",
    BX:"Other Category",
    KU:"Kudumbi",
    PD:"Persons with Disability",
    CC:"Special",
    SP:"Special",
    SD:"Special",
    XS:"Special",
    RP:"Special"
};


/* -------------------------
   START
------------------------- */

function start(){

    if(!window.LBS_DATA){

        document.getElementById("app").innerHTML=`
            <div class="empty">
                <h3>Data could not be loaded</h3>
                <p>Make sure data.js is in the same repository.</p>
            </div>
        `;

        return;
    }

    DATA=window.LBS_DATA;

    showHome();
}


/* -------------------------
   HOME
------------------------- */

function showHome(){

    let courseOptions="";

    DATA.courses.forEach(course=>{

        courseOptions+=`
            <option value="${course.value}">
                ${course.name}
            </option>
        `;

    });


    document.getElementById("app").innerHTML=`

        <div class="tabs">

            <button
                class="tab active"
                onclick="showHome()">
                Predictor
            </button>

            <button
                class="tab"
                onclick="showExactData()">
                Exact 2025 Data
            </button>

        </div>


        <div class="card">

            <div class="grid">

                <div>

                    <label>Course</label>

                    <select id="course"
                            onchange="updateQuotas()">

                        ${courseOptions}

                    </select>

                </div>


                <div>

                    <label>Index Mark</label>

                    <input
                        id="indexMark"
                        type="number"
                        step="0.01"
                        placeholder="Enter index mark"
                    >

                </div>

            </div>


            <div style="margin-top:16px">

                <label>Quota</label>

                <select id="quota">
                    <option value="ALL">
                        All Quotas
                    </option>
                </select>

            </div>


            <button
                class="main-button"
                onclick="predict()">

                PREDICT COLLEGES

            </button>

        </div>


        <div id="results"></div>
    `;


    updateQuotas();
}


/* -------------------------
   QUOTAS
------------------------- */

function updateQuotas(){

    const course=
        DATA.courses.find(
            c=>String(c.value)===
            String(document.getElementById("course").value)
        );

    const select=
        document.getElementById("quota");

    select.innerHTML=`
        <option value="ALL">
            All Quotas
        </option>
    `;

    if(!course)return;

    course.quotas.forEach(q=>{

        const option=
            document.createElement("option");

        option.value=q;

        option.textContent=
            q+" — "+
            (QUOTA_NAMES[q]||q);

        select.appendChild(option);

    });
}


/* -------------------------
   CUTOFF
------------------------- */

function cutoff(college,quota){

    if(quota==="ALL"){
        return college.cutoff;
    }

    if(
        college.cutoffs &&
        college.cutoffs[quota]!==undefined
    ){
        return college.cutoffs[quota];
    }

    return null;
}


/* -------------------------
   PREDICT
------------------------- */

function predict(){

    const course=
        DATA.courses.find(
            c=>String(c.value)===
            String(document.getElementById("course").value)
        );

    const mark=
        parseFloat(
            document.getElementById("indexMark").value
        );

    const quota=
        document.getElementById("quota").value;


    if(isNaN(mark)){
        alert("Please enter your index mark.");
        return;
    }


    const possible=
        course.colleges.filter(college=>{

            const c=cutoff(college,quota);

            return(
                c!==null &&
                c!==undefined &&
                mark>=c
            );

        });


    possible.sort(
        (a,b)=>
        (cutoff(b,quota)||0)-
        (cutoff(a,quota)||0)
    );


    const government=
        possible.filter(
            c=>c.category==="Government"
        );

    const self=
        possible.filter(
            c=>c.category==="Self-financing"
        );


    showResults(
        course,
        mark,
        quota,
        government,
        self
    );
}


/* -------------------------
   RESULTS
------------------------- */

function showResults(
    course,
    mark,
    quota,
    government,
    self
){

    let html=`

        <div class="summary">

            <div class="stat">
                <small>Course</small>
                <strong>${course.name}</strong>
            </div>

            <div class="stat">
                <small>Index Mark</small>
                <strong>${mark.toFixed(2)}</strong>
            </div>

            <div class="stat">
                <small>Quota</small>
                <strong>${quota}</strong>
            </div>

            <div class="stat">
                <small>Colleges Found</small>
                <strong>
                    ${government.length+self.length}
                </strong>
            </div>

        </div>
    `;


    html+=resultTable(
        "Government Colleges",
        government,
        mark,
        quota,
        "govt"
    );


    html+=resultTable(
        "Self-financing Colleges",
        self,
        mark,
        quota,
        "self"
    );


    document.getElementById("results").innerHTML=html;
}


function resultTable(
    title,
    colleges,
    mark,
    quota,
    type
){

    let html=`

        <h2 class="section-title ${type}">
            ${title}
            <span style="font-size:13px;color:#777">
                (${colleges.length})
            </span>
        </h2>
    `;


    if(!colleges.length){

        return html+`
            <div class="empty">
                No matching colleges found.
            </div>
        `;
    }


    html+=`

        <div class="table-wrap">

        <table>

        <thead>

        <tr>
            <th>Code</th>
            <th>College</th>
            <th class="number">Cutoff</th>
            <th class="number">Seats</th>
            <th class="number">Margin</th>
        </tr>

        </thead>

        <tbody>
    `;


    colleges.forEach(c=>{

        const value=cutoff(c,quota);

        const margin=mark-value;


        html+=`

            <tr
                class="clickable"
                onclick="showCollege('${c.value}')">

                <td>
                    <span class="code">
                        ${c.code}
                    </span>
                </td>

                <td>
                    ${c.name}
                </td>

                <td class="number">
                    ${format(value)}
                </td>

                <td class="number">
                    ${c.allotted}
                </td>

                <td class="number margin">
                    +${format(margin)}
                </td>

            </tr>
        `;

    });


    html+=`
        </tbody>
        </table>
        </div>
    `;

    return html;
}


/* -------------------------
   EXACT DATA PAGE
------------------------- */

function showExactData(){

    let courseOptions="";

    DATA.courses.forEach(course=>{

        courseOptions+=`
            <option value="${course.value}">
                ${course.name}
            </option>
        `;

    });


    document.getElementById("app").innerHTML=`

        <div class="tabs">

            <button
                class="tab"
                onclick="showHome()">
                Predictor
            </button>

            <button
                class="tab active">
                Exact 2025 Data
            </button>

        </div>


        <div class="card">

            <label>Course</label>

            <select id="dataCourse"
                    onchange="renderExactData()">

                ${courseOptions}

            </select>

        </div>


        <div id="exactResults"></div>
    `;


    renderExactData();
}


/* -------------------------
   EXACT DATA TABLE
------------------------- */

function renderExactData(){

    const course=
        DATA.courses.find(
            c=>String(c.value)===
            String(document.getElementById("dataCourse").value)
        );


    if(!course)return;


    let html=`

        <div class="summary">

            <div class="stat">
                <small>Course</small>
                <strong>${course.name}</strong>
            </div>

            <div class="stat">
                <small>Colleges</small>
                <strong>${course.colleges.length}</strong>
            </div>

            <div class="stat">
                <small>Year</small>
                <strong>${DATA.year}</strong>
            </div>

            <div class="stat">
                <small>Maximum Index</small>
                <strong>${course.maxIndex}</strong>
            </div>

        </div>


        <div class="table-wrap">

        <table>

        <thead>

        <tr>

            <th>Code</th>
            <th>College</th>
            <th>Type</th>
            <th class="number">Allotted</th>
            <th class="number">Cutoff</th>
            <th class="number">Merit</th>
            <th class="number">Top</th>

        </tr>

        </thead>

        <tbody>
    `;


    course.colleges.forEach(c=>{

        html+=`

            <tr
                class="clickable"
                onclick="showCollege('${c.value}')">

                <td>
                    <span class="code">
                        ${c.code}
                    </span>
                </td>

                <td>
                    ${c.name}
                </td>

                <td>
                    ${c.category}
                </td>

                <td class="number">
                    ${c.allotted}
                </td>

                <td class="number">
                    ${format(c.cutoff)}
                </td>

                <td class="number">
                    ${format(c.cutoffMerit)}
                </td>

                <td class="number">
                    ${format(c.top)}
                </td>

            </tr>
        `;

    });


    html+=`
        </tbody>
        </table>
        </div>
    `;


    document.getElementById("exactResults").innerHTML=html;
}


/* -------------------------
   COLLEGE DETAILS
------------------------- */

function showCollege(value){

    let currentCourse=
        DATA.courses.find(course=>
            course.colleges.some(
                c=>String(c.value)===String(value)
            )
        );


    if(!currentCourse)return;


    const college=
        currentCourse.colleges.find(
            c=>String(c.value)===String(value)
        );


    if(!college)return;


    let quotaRows="";


    Object.entries(
        college.cutoffs||{}
    )
    .forEach(([q,value])=>{

        quotaRows+=`

            <tr>

                <td>
                    <strong>${q}</strong>
                </td>

                <td>
                    ${QUOTA_NAMES[q]||q}
                </td>

                <td class="number">
                    ${format(value)}
                </td>

            </tr>
        `;

    });


    document.getElementById("app").innerHTML=`

        <button
            class="secondary"
            onclick="showHome()">

            ← Back to Predictor

        </button>


        <div class="card">

            <h2>
                ${college.name}
            </h2>

            <p style="color:#999">
                ${college.code}
                ·
                ${college.category}
            </p>


            <div class="detail-grid">

                <div class="stat">
                    <small>Allotted</small>
                    <strong>${college.allotted}</strong>
                </div>

                <div class="stat">
                    <small>Overall Cutoff</small>
                    <strong>${format(college.cutoff)}</strong>
                </div>

                <div class="stat">
                    <small>Merit Cutoff</small>
                    <strong>${format(college.cutoffMerit)}</strong>
                </div>

                <div class="stat">
                    <small>Top Index</small>
                    <strong>${format(college.top)}</strong>
                </div>

            </div>


            <h3>
                Exact Quota-wise Cutoffs
            </h3>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>Quota</th>
                            <th>Category</th>
                            <th class="number">Cutoff</th>
                        </tr>

                    </thead>

                    <tbody>

                        ${quotaRows}

                    </tbody>

                </table>

            </div>

        </div>
    `;
}


/* -------------------------
   FORMAT
------------------------- */

function format(value){

    if(
        value===null ||
        value===undefined ||
        value===""
    ){
        return "—";
    }

    return Number(value).toFixed(2);
}


/* -------------------------
   RUN
------------------------- */

start();

</script>

</body>
</html>
